name: Filter issue
description: Report a false positive, missed ad/tracker, or broken website caused by a filter.
title: "[Filter]: "
labels: ["filter-issue", "needs-triage"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Issue type
      options:
        - False positive / website broken
        - Ad or tracker not blocked
        - Performance issue
        - Filter list metadata error
        - License / attribution issue
    validations:
      required: true
  - type: input
    id: entry
    attributes:
      label: Catalog entry ID and trust tier
      placeholder: entry-id (community)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ShieldBlock version / commit
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Public URL and reproduction steps
      description: Do NOT share private URLs, accounts, or browsing history.
    validations:
      required: true
  - type: textarea
    id: minimal_config
    attributes:
      label: Minimal config and suspected rule
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence (redacted)
  - type: checkboxes
    id: routing
    attributes:
      label: Routing
      options:
        - label: I have checked the list maintainer homepage; if they have a tracker, I will file there too.
          required: true
