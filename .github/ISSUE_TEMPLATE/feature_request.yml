name: Feature request
description: Propose a new feature for community discussion and vote.
title: "[Feature]: "
labels: ["enhancement", "proposal", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before proposing a solution.
        Votes (thumbs up) signal priority. Do not request remote code or sandbox bypass.
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label: I have searched existing issues and the roadmap.
          required: true
        - label: I am not requesting remote code execution or unsupported quota bypass.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and user group
      description: Who has the problem, how often, what is the current workflow?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired behavior and acceptance criteria
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Most relevant capability layer
      options:
        - ShieldBlock Cyber Edition (MV3)
        - Managed Enterprise (future)
        - Native Companion / Power Mode (future)
        - Unknown, needs research
    validations:
      required: true
  - type: dropdown
    id: mv3_mapping
    attributes:
      label: MV3 feasibility
      options:
        - Has equivalent public API
        - Partially achievable
        - No equivalent API
        - Unconfirmed
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / examples / API docs
      description: Link to official docs, benchmarks, or reproductions if available.
  - type: textarea
    id: privacy_security
    attributes:
      label: Privacy, permissions, and threat model
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: RAM / CPU / quota impact
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or fallback
