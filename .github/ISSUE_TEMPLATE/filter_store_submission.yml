name: Filter Store submission
description: Propose adding a filter list to the ShieldBlock catalog.
title: "[Filter Store]: add "
labels: ["filter-store", "needs-triage"]
body:
  - type: input
    id: name
    attributes:
      label: List name and homepage URL
    validations:
      required: true
  - type: input
    id: raw_url
    attributes:
      label: Raw subscription URL (HTTPS)
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Ads and trackers
        - Privacy and fingerprinting
        - Annoyances and cosmetics
        - Security and malware
        - Regional / language-specific
        - Developer / testing
    validations:
      required: true
  - type: dropdown
    id: trust
    attributes:
      label: Proposed trust tier
      options:
        - community
        - verified
        - curated
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why this list belongs in the catalog
    validations:
      required: true
  - type: textarea
    id: maintenance
    attributes:
      label: Maintenance status and update frequency
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: The list is publicly accessible via HTTPS.
          required: true
        - label: The list has a clear license compatible with GPL-3.0.
          required: true
        - label: I understand catalog inclusion is not an endorsement by any upstream project.
          required: true
