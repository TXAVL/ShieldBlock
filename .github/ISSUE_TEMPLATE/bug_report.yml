name: Bug Report
description: Report a reproducible bug in ShieldBlock (TXA Studio).
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in ShieldBlock by TXA Studio.
        Do NOT share tokens, browsing history, or personal data.
        For security vulnerabilities, use the private Security advisory.
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label: I have searched for existing issues and tested the latest release.
          required: true
        - label: I understand ShieldBlock is an independent extension by TXA Studio.
          required: true
        - label: I have removed sensitive data from logs/screenshots.
          required: true
  - type: input
    id: version
    attributes:
      label: ShieldBlock version / commit
      placeholder: "v1.1.1 or commit SHA"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "Chrome 140.0.x, Windows 11 / macOS 15"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Load unpacked / Developer mode
        - GitHub release zip
        - Chrome Web Store
    validations:
      required: true
  - type: dropdown
    id: memory_profile
    attributes:
      label: Memory profile
      options:
        - auto
        - balanced
        - low-memory
        - Unknown / not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction steps
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (sensitive data removed)
      render: text
