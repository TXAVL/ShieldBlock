name: Bug report
description: Báo lỗi có thể tái hiện trong ShieldBlock: Cyber Defense (TXA Studio).
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã báo lỗi cho tiện ích ShieldBlock (TXA Studio). Vui lòng không đăng token, lịch sử duyệt web hoặc dữ liệu cá nhân nhạy cảm. Lỗ hổng bảo mật vui lòng gửi qua mục Security riêng.
  - type: checkboxes
    id: preflight
    attributes:
      label: Kiểm tra trước
      options:
        - label: Tôi đã tìm issue trùng và thử bản phát hành mới nhất của ShieldBlock.
          required: true
        - label: Tôi hiểu ShieldBlock là tiện ích độc lập phát triển bởi TXA Studio.
          required: true
        - label: Tôi đã xóa dữ liệu nhạy cảm khỏi log/ảnh chụp.
          required: true
  - type: input
    id: version
    attributes:
      label: Phiên bản/commit ShieldBlock
      placeholder: "v1.1.1 hoặc commit SHA"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Trình duyệt và hệ điều hành
      placeholder: "Chrome 140.0.x, Edge 140, Windows 11"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Cách cài đặt
      options:
        - Load unpacked / Developer Mode
        - GitHub release zip package
        - Chrome Web Store (CWS)
        - TXA Studio Portal (txastudio.click)
    validations:
      required: true
  - type: dropdown
    id: memory_profile
    attributes:
      label: Chế độ Memory profile
      options:
        - auto (Tự động tối ưu)
        - balanced (Cân bằng)
        - low-memory (Tiết kiệm RAM)
        - Không biết / không áp dụng
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện tối thiểu
      placeholder: |
        1. Bật tính năng/bộ lọc...
        2. Mở URL mẫu...
        3. Thực hiện thao tác...
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Kết quả thực tế
    validations:
      required: true
  - type: textarea
    id: filters
    attributes:
      label: Ruleset / Bộ lọc liên quan
      description: Ghi ID bộ lọc hoặc custom ruleset; thử lại với cấu hình mặc định nếu có thể.
  - type: textarea
    id: diagnostics
    attributes:
      label: Log Diagnostics (đã ẩn thông tin nhạy cảm)
      description: Xuất log chẩn đoán từ giao diện ShieldBlock; không đăng lịch sử duyệt web cá nhân.
      render: text
