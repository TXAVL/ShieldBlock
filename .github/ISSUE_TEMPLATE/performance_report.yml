name: Performance / low-memory report
description: Report a RAM, CPU, or compile regression with a reproducible workload.
title: "[Performance]: "
labels: ["performance", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Absolute RAM varies by Chrome/OS. Provide baseline and delta under identical conditions.
        Do NOT share browsing data.
  - type: input
    id: version
    attributes:
      label: ShieldBlock version / commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: CPU, RAM, OS, Chrome version
      placeholder: 4 GB RAM, 2 cores, Windows 10, Chrome 140.0.x
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: memoryProfile
      options:
        - auto (resolved low-memory)
        - auto (resolved balanced)
        - low-memory
        - balanced
    validations:
      required: true
  - type: textarea
    id: workload
    attributes:
      label: Reproduction workload
    validations:
      required: true
  - type: textarea
    id: measurements
    attributes:
      label: Baseline and measured results
      render: text
    validations:
      required: true
  - type: textarea
    id: local_telemetry
    attributes:
      label: Local memory telemetry (redacted)
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Additional observations / workaround
