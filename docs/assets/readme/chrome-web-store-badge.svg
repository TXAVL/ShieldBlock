<svg xmlns="http://www.w3.org/2000/svg" width="206" height="58" viewBox="0 0 206 58" fill="none">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="204" height="56" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Chrome Logo -->
  <g transform="translate(18, 11)">
    <!-- Base circle (Green #34A853) -->
    <circle cx="18" cy="18" r="18" fill="#34A853"/>
    <!-- Red arc (#EA4335) -->
    <path d="M18 0 C27.94 0 36 8.06 36 18 L18 18 Z" fill="#EA4335"/>
    <path d="M18 0 C10.1 0 3.33 5.08 0.77 12.24 L10.02 28.26 L18 18 L18 0 Z" fill="#EA4335"/>
    <!-- Yellow arc (#FBBC05) -->
    <path d="M36 18 C36 27.94 27.94 36 18 36 L10.02 28.26 L18 18 L36 18 Z" fill="#FBBC05"/>
    <path d="M36 18 C36 24.36 32.68 30 27.67 33.17 L18.42 17.15 L36 18 Z" fill="#FBBC05"/>
    <!-- Green section (#34A853) -->
    <path d="M18 36 C8.06 36 0 27.94 0 18 C0 15.93 0.35 13.94 1 12.09 L10.25 28.11 L18 36 Z" fill="#34A853"/>
    <!-- White ring -->
    <circle cx="18" cy="18" r="8.5" fill="#FFFFFF"/>
    <!-- Blue center (#4285F4) -->
    <circle cx="18" cy="18" r="6.8" fill="#4285F4"/>
  </g>
  <!-- Text -->
  <text x="64" y="24" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" letter-spacing="0.2">available in the</text>
  <text x="64" y="42" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="-0.2">Chrome Web Store</text>
</svg>
